name: Feature request
description: Suggest something PdfLapas should do that is not a PptxGenJS compatibility gap.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what stops you today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What you would like PdfLapas to do. Note any API or HTML output it would change.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: ai-use
    attributes:
      label: AI use
      description: Did you use AI tools to write this issue or find what it reports? Either answer is fine; it helps reviewers.
      options:
        - No AI
        - AI helped (suggestions, editing, investigation); I wrote and checked it
        - AI wrote most of it; I reviewed and checked it
        - An AI agent wrote and filed it
    validations:
      required: true
  - type: input
    id: ai-tools
    attributes:
      label: AI tools used
      description: Optional. Which tools, and for what.
