name: Fuzz

# Nightly fuzzing (#661): the cargo-fuzz targets of pdf-core (crates/fuzz, docs/FUZZING.md) for a few minutes each,
# and the fast-check properties (tests/*.fuzz.test.ts) with a new seed and more runs than `bun test` gives them.
# Not a required check: a failure here is triaged by hand (a private advisory when it is exploitable), never filed
# automatically.
on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds each cargo-fuzz target runs
        default: "600"
      scale:
        description: Multiplier of each fast-check property's run count
        default: "20"

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: false

env:
  # cargo-fuzz needs nightly (libFuzzer, sanitizer flags); pinned here, its only use, so a run is reproducible.
  FUZZ_NIGHTLY: nightly-2026-05-15
  CARGO_FUZZ_VERSION: 0.13.2

jobs:
  rust:
    name: Fuzz ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        target: [render_html, add_font]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install fonts and fontTools
        # render_html draws its text in Liberation Sans; add_font's seeds are subsets of a glyf, a CFF and a CBDT face.
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-liberation fonts-urw-base35 fonts-noto-color-emoji fonttools

      - name: Install pinned nightly toolchain
        run: rustup toolchain install "$FUZZ_NIGHTLY" --profile minimal && rustc +"$FUZZ_NIGHTLY" --version

      - name: Cache cargo-fuzz, registry and fuzz target dir
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/cargo-fuzz
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            crates/fuzz/target
          key: fuzz-build-${{ runner.os }}-${{ env.FUZZ_NIGHTLY }}-${{ env.CARGO_FUZZ_VERSION }}-${{ hashFiles('crates/fuzz/Cargo.lock', 'crates/Cargo.lock') }}
          restore-keys: fuzz-build-${{ runner.os }}-${{ env.FUZZ_NIGHTLY }}-${{ env.CARGO_FUZZ_VERSION }}-

      - name: Install pinned cargo-fuzz
        run: command -v cargo-fuzz || cargo install cargo-fuzz --version "$CARGO_FUZZ_VERSION" --locked

      # The corpus the last nights grew, so each night starts where the previous one stopped.
      - name: Restore corpus
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: crates/fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-

      - name: Set up Bun
        if: matrix.target == 'render_html'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Seed render_html from the visual decks
        if: matrix.target == 'render_html'
        run: bun ci && bun run scripts/export-fuzz-seeds.ts

      - name: Seed add_font with font subsets
        if: matrix.target == 'add_font'
        run: |
          mkdir -p crates/fuzz/corpus/add_font
          pyftsubset /usr/share/fonts/truetype/liberation/LiberationSans-Regular.ttf --unicodes=U+0020-007E --output-file=crates/fuzz/corpus/add_font/glyf.ttf
          pyftsubset /usr/share/fonts/opentype/urw-base35/NimbusSansNarrow-Bold.otf --unicodes=U+0020-007E --output-file=crates/fuzz/corpus/add_font/cff.otf
          pyftsubset /usr/share/fonts/truetype/noto/NotoColorEmoji.ttf --unicodes=U+1F600 --output-file=crates/fuzz/corpus/add_font/cbdt.ttf

      - name: Run ${{ matrix.target }}
        working-directory: crates
        env:
          FUZZ_FONTS: /usr/share/fonts/truetype/liberation/LiberationSans-Regular.ttf
          SECONDS_TO_RUN: ${{ inputs.seconds || '600' }}
          TARGET: ${{ matrix.target }}
        # The limits of docs/FUZZING.md; render_html reads its dictionary.
        run: |
          if [ "$TARGET" = render_html ]; then
            cargo +"$FUZZ_NIGHTLY" fuzz run render_html -- -dict=fuzz/render_html.dict -max_total_time="$SECONDS_TO_RUN" -max_len=131072 -timeout=10 -rss_limit_mb=4096
          else
            cargo +"$FUZZ_NIGHTLY" fuzz run add_font -- -max_total_time="$SECONDS_TO_RUN" -max_len=65536 -timeout=10 -rss_limit_mb=4096
          fi

      - name: Save corpus
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: crates/fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}

      # The input that crashed, to reproduce with `cargo +nightly fuzz run <target> <file>`. Kept briefly: anyone who
      # can read the repository can download it, so triage it (and move it to a private advisory) within the week.
      - name: Upload crash inputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: crates/fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: ignore
          retention-days: 7

  properties:
    name: Fuzz fast-check properties
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Install pinned Rust toolchain
        # rustup reads rust-toolchain.toml; the parseModel() property renders through the WASM renderer.
        run: rustup toolchain install && rustc --version

      - name: Build WASM with pinned tools
        run: sh packages/wasm/build-wasm.sh

      - name: Install locked dependencies
        run: bun ci

      - name: Run properties with a new seed
        env:
          # tests/fuzzConfig.ts reads both. The run id is new every night and printed, so a failure reproduces locally.
          FUZZ_SEED: ${{ github.run_id }}
          FUZZ_SCALE: ${{ inputs.scale || '20' }}
        run: |
          echo "FUZZ_SEED=$FUZZ_SEED FUZZ_SCALE=$FUZZ_SCALE"
          bun test --timeout 1800000 tests/*.fuzz.test.ts
